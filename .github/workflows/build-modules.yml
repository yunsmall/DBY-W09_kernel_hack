name: Build Modules

on:
  workflow_dispatch:
    inputs:
      config_url:
        description: '内核 .config 文件下载地址（如 gist raw URL）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download kernel config
        run: |
          curl -sSL "${{ inputs.config_url }}" -o /tmp/kernel_config
          if ! grep -q 'CONFIG_' /tmp/kernel_config; then
            echo "ERROR: not a valid kernel config file"
            exit 1
          fi
          cp /tmp/kernel_config analysis/my_tablet_origin_config

      - name: Setup kernel source
        run: python3 tools/setup_kernel_source.py

      - name: Build
        run: |
          . env.sh

          mkdir -p output/kernel_build
          cp analysis/my_tablet_origin_config output/kernel_build/.config
          cd dby-w09-4.0
          scripts/config --file ../output/kernel_build/.config --disable MODULE_SIG_ALL
          make O=../output/kernel_build olddefconfig
          make O=../output/kernel_build modules_prepare -j$(nproc)
          make O=../output/kernel_build modules -j$(nproc)

          # SELinux module
          make O=../output/kernel_build M=../selinux_module modules

          # Install all modules to staging dir
          mkdir -p ../output/modules_install
          make O=../output/kernel_build INSTALL_MOD_PATH=../output/modules_install modules_install || true

      - name: Package
        run: |
          # All modules (installed tree, excludes SELinux)
          tar czf output/all-modules.tar.gz -C output/modules_install .
          # SELinux module
          cp output/selinux_module/selinux_permissive.ko output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: all-modules
          path: output/all-modules.tar.gz

      - name: Upload SELinux
        uses: actions/upload-artifact@v4
        with:
          name: selinux-module
          path: output/selinux_permissive.ko
